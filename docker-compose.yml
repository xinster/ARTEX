services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # 上游镜像 autumn27/artex 所在的 Docker Hub 仓库已删除（拉取必然 404）。
    # 这里改为**本地构建**：默认用 Dockerfile 从当前源码构建，不依赖任何外部镜像仓库。
    #
    #   docker compose up -d --build      # 构建并启动（首次必须带 --build）
    #
    # 想用自己推到 registry 的镜像？在 .env 里设 ARTEX_IMAGE 覆盖：
    #   ARTEX_IMAGE=myreg.io/artex:0.3.15
    # 同时用 ARTEX_TAG 选择 tag（仅在 ARTEX_IMAGE 未设时生效）。
    image: ${ARTEX_IMAGE:-artex:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Dockerfile 靠 TARGETARCH 挑 dist/<arch>/artex。buildx 默认会注入宿主机
        # 架构，所以这里**只在显式设置时**覆盖——传空串会把预置值清掉、导致
        # COPY dist//artex 失败。交叉编译（如在 arm64 上给 amd64 出镜像）才需要它。
        TARGETARCH: ${ARTEX_TARGETARCH:-}
    # 本地构建的镜像不从 registry 拉；设了 ARTEX_IMAGE 指向自己的镜像时可改成 missing/always。
    pull_policy: ${ARTEX_PULL_POLICY:-never}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
